<script>
'use strict';

const $=s=>document.querySelector(s);
const KEY='ai_ecosystem_v24';

const emptyDB={
 tasks:[],memories:[],experiments:[],benchmarks:[],archive:[]
};

let db=loadDB();
let page='dashboard';
let stopRequested=false;
let running=false;

function loadDB(){
 try{
  return {...emptyDB,...JSON.parse(localStorage.getItem(KEY)||'{}')};
 }catch(e){return {...emptyDB};}
}
function saveDB(){
 try{
  localStorage.setItem(KEY,JSON.stringify(db));
  return true;
 }catch(e){
  alert('Không đủ dung lượng lưu. Hãy xuất dữ liệu JSON.');
  return false;
 }
}
function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function esc(v){
 return String(v).replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function addRecord(list,obj){
 list.push({id:uid(),...obj});
 saveDB();render();
}
function removeRecord(list,index){
 list.splice(index,1);saveDB();render();
}

const tabs=[
 ['dashboard','Dashboard'],
 ['research','Autonomous Research'],
 ['evolution','Evolution Engine'],
 ['benchmark','Benchmark'],
 ['validation','Validation'],
 ['archive','Knowledge Archive'],
 ['tasks','Tasks'],
 ['memory','Memory']
];

function render(){
 $('#nav').innerHTML=tabs.map(([id,name])=>
 `<button class="${page===id?'active':''}" onclick="go('${id}')">${name}</button>`
 ).join('')+
 `<button onclick="exportData()">Export</button>
 <button onclick="$('#importFile').click()">Import</button>
 <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">`;

 const views={
 dashboard:dashboardView,
 research:researchView,
 evolution:evolutionView,
 benchmark:benchmarkView,
 validation:validationView,
 archive:archiveView,
 tasks:tasksView,
 memory:memoryView
 };
 $('#app').innerHTML=views[page]();
}
function go(p){page=p;render()}

function dashboardView(){
 const best=db.experiments.slice().sort((a,b)=>a.validationLoss-b.validationLoss)[0];

 <div class="stat"><strong>${db.archive.length}</strong>Knowledge records</div>
 </div></section>
 <section class="card">
 <h2>Best validated experiment</h2>
 ${best?`<p>Validation MSE: <b>${best.validationLoss.toExponential(5)}</b></p>
 <p>Model: y = ${best.a.toFixed(5)}x + ${best.b.toFixed(5)}</p>
 <p>Configuration: population ${best.population}, mutation ${best.mutation}</p>`:
 '<p class="muted">Chưa có thí nghiệm được lưu.</p>'}
 </section>
 <section class="card">
 <h2>System status</h2>

 <p>Storage: localStorage của thiết bị</p>
 <p>External API: Không sử dụng</p>

 </section>
 <section class="card">

 <p>1. Tạo giả thuyết → 2. Thiết kế thí nghiệm → 3. Chạy thử nghiệm</p>

}

/* HYPOTHESIS GENERATOR */
function generateHypotheses(){
 return [
  {name:'H1 – Mutation thấp',population:20,mutation:.08,
   reason:'Đột biến thấp có thể giúp duy trì nghiệm tốt đã tìm thấy.'},
  {name:'H2 – Mutation trung bình',population:20,mutation:.20,
   reason:'Đột biến trung bình có thể cân bằng khai thác và khám phá.'},
  {name:'H3 – Mutation cao',population:20,mutation:.40,
   reason:'Đột biến cao có thể tăng khả năng thoát khỏi vùng nghiệm kém.'},
  {name:'H4 – Population lớn',population:40,mutation:.08,
   reason:'Quần thể lớn có thể tăng đa dạng cá thể.'},
  {name:'H5 – Kết hợp',population:40,mutation:.20,
   reason:'Quần thể lớn và đột biến trung bình có thể cải thiện kết quả.'},
  {name:'H6 – Khám phá mạnh',population:40,mutation:.40,
   reason:'Quần thể lớn cùng đột biến cao có thể tăng khám phá.'}
 ];
}
function researchView(){
 const hs=generateHypotheses();
 return `
 <section class="card">
 <h2>1. Hypothesis Generator</h2>
 <p>Hệ thống tạo các giả thuyết về ảnh hưởng của population và mutation.</p>
 ${hs.map(h=>`<div class="item">
 <b>${h.name}</b><br>
 <span class="tag">Population ${h.population}</span>
 <span class="tag">Mutation ${h.mutation}</span>
 <p class="muted">${h.reason}</p>
 </div>`).join('')}
 <p class="warn">Đây là giả thuyết cần kiểm nghiệm, chưa phải kết luận.</p>
 </section>
 <section class="card">
 <h2>2. Experiment Designer</h2>
 <p>Bộ thí nghiệm so sánh 6 cấu hình, mỗi cấu hình chạy nhiều lần với seed khác nhau.</p>
 <div class="row">
 <label>Generations
 <input id="researchGen" type="number" min="10" max="300" value="80"></label>
 <label>Repeats / configuration
 <input id="researchRepeats" type="number" min="1" max="10" value="3"></label>
 </div>
 <p class="muted">Tối đa 180 lần chạy. Nên bắt đầu với 80 generations và 3 repeats trên điện thoại.</p>
 <button class="primary" id="researchStart" onclick="startResearch()">Run Autonomous Research</button>
 <button class="danger" id="researchStop" onclick="stopResearch()" disabled>Stop</button>
 <p id="researchStatus">Ready</p>
 <progress id="researchProgress" value="0" max="1" style="width:100%"></progress>
 </section>
 <section class="card">
 <h2>3. Experiment Results</h2>
 <div id="researchResults">${latestResearchHTML()}</div>
 <canvas id="researchChart"></canvas>
 </section>`;
}
function latestResearchHTML(){
 const r=db.experiments.slice().sort((a,b)=>a.validationLoss-b.validationLoss).slice(0,6);
 if(!r.length)return '<p class="muted">Chưa có kết quả. Hãy chạy thí nghiệm.</p>';
 return r.map(x=>`<div class="item">
 <b>${esc(x.hypothesis)}</b>
 <p>Validation MSE: ${x.validationLoss.toExponential(5)}</p>
 <p>Training MSE: ${x.trainLoss.toExponential(5)}</p>
 <p>a=${x.a.toFixed(4)} · b=${x.b.toFixed(4)}</p>
 </div>`).join('');
}

/* DETERMINISTIC RANDOM GENERATOR */
function makeRandom(seed){
 let state=seed>>>0;
 return function(){
  state=(state+0x6D2B79F5)>>>0;
  let t=state;
  t=Math.imul(t^(t>>>15),t|1);
  t^=t+Math.imul(t^(t>>>7),t|61);
  return ((t^(t>>>14))>>>0)/4294967296;
 };
}

/* MODEL AND INDEPENDENT DATA */
function trainLoss(a,b){
 let total=0,count=0;
 for(let x=-5;x<=5;x++){
  const error=(a*x+b)-(2*x+3);
  total+=error*error;count++;
 }
 return total/count;
}
function validationLoss(a,b){
 let total=0,count=0;
 for(let i=0;i<38;i++){
  const x=-9.5+i*.5;
  const error=(a*x+b)-(2*x+3);
  total+=error*error;count++;
 }
 return total/count;
}
function fitness(p){return trainLoss(p.a,p.b)}

/* GENETIC ALGORITHM */
function runOneGA(config,seed){
 const random=makeRandom(seed);
 const N=config.population;
 const G=config.generations;
 const mutation=config.mutation;
 let population=Array.from({length:N},()=>({
  a:random()*20-10,
  b:random()*20-10
 }));
 let bestHistory=[];
 let diversityHistory=[];

 function tournament(){
  let best=population[Math.floor(random()*N)];
  for(let i=0;i<3;i++){
   const candidate=population[Math.floor(random()*N)];
   if(fitness(candidate)<fitness(best))best=candidate;
  }
  return best;
 }
 for(let g=0;g<G;g++){
  population.sort((x,y)=>fitness(x)-fitness(y));
  bestHistory.push(fitness(population[0]));
  const meanA=population.reduce((s,p)=>s+p.a,0)/N;
  const meanB=population.reduce((s,p)=>s+p.b,0)/N;
  const diversity=population.reduce((s,p)=>
   s+Math.abs(p.a-meanA)+Math.abs(p.b-meanB),0)/N;
  diversityHistory.push(diversity);

  const eliteCount=Math.max(2,Math.floor(N*.2));
  const next=population.slice(0,eliteCount).map(p=>({...p}));

  while(next.length<N){
   const p1=tournament(),p2=tournament();
   const alpha=random();
   const child={
    a:alpha*p1.a+(1-alpha)*p2.a,
    b:alpha*p1.b+(1-alpha)*p2.b
   };
   if(random()<mutation)child.a+=(random()-.5)*4;
   if(random()<mutation)child.b+=(random()-.5)*4;
   child.a=Math.max(-20,Math.min(20,child.a));
   child.b=Math.max(-20,Math.min(20,child.b));
   next.push(child);
  }
  population=next;
 }
 population.sort((x,y)=>fitness(x)-fitness(y));
 const best=population[0];
 return {
  a:best.a,b:best.b,
  trainLoss:trainLoss(best.a,best.b),
  validationLoss:validationLoss(best.a,best.b),
  bestHistory,diversityHistory
 };
}

/* AUTONOMOUS EXPERIMENT RUNNER */
function stopResearch(){stopRequested=true}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

async function startResearch(){
 if(running)return;
 const generations=Math.max(10,Math.min(300,+$('#researchGen').value||80));
 const repeats=Math.max(1,Math.min(10,+$('#researchRepeats').value||3));
 const hypotheses=generateHypotheses();
 const total=hypotheses.length*repeats;
 let completed=0;
 running=true;stopRequested=false;

 $('#researchStart').disabled=true;
 $('#researchStop').disabled=false;
 $('#researchStatus').textContent='Preparing experiments...';
 $('#researchProgress').max=total;
 $('#researchProgress').value=0;

 const batch=[];
 try{
  for(let h=0;h<hypotheses.length;h++){
   const hypothesis=hypotheses[h];
   const results=[];
   for(let rep=0;rep<repeats;rep++){
    if(stopRequested)break;
    const seed=10000+h*1000+rep*17+Date.now()%997;
    const result=runOneGA({
     population:hypothesis.population,
     mutation:hypothesis.mutation,
     generations
    },seed);

    results.push(result);
    completed++;
    $('#researchProgress').value=completed;
    $('#researchStatus').textContent=
     `Running ${hypothesis.name} · ${rep+1}/${repeats} · ${completed}/${total}`;
    await wait(10);
   }
   if(results.length){
    const avg=key=>results.reduce((s,r)=>s+r[key],0)/results.length;
    const best=results.slice().sort((a,b)=>a.validationLoss-b.validationLoss)[0];
    const record={
     id:uid(),
     date:new Date().toISOString(),
     hypothesis:hypothesis.name,
     reason:hypothesis.reason,
     population:hypothesis.population,
     mutation:hypothesis.mutation,
     generations,
     repeats:results.length,
     a:best.a,b:best.b,
     trainLoss:avg('trainLoss'),
     validationLoss:avg('validationLoss'),
     bestValidation:best.validationLoss,
     seeds:results.length
    };
    batch.push(record);
    db.experiments.push(record);
   }
   saveDB();
   $('#researchResults').innerHTML=latestResearchHTML();
  }
 }catch(e){
  $('#researchStatus').textContent='Error: '+e.message;
 }finally{
  if(batch.length){
   const winner=batch.slice().sort((a,b)=>a.validationLoss-b.validationLoss)[0];
   db.archive.push({
    id:uid(),
    date:new Date().toISOString(),
    type:'research-summary',
    title:'Best configuration: '+winner.hypothesis,
    text:`Validation MSE ${winner.validationLoss}; a=${winner.a}; b=${winner.b}`,
    result:winner
   });
   saveDB();
  }
  running=false;
  $('#researchStart').disabled=false;
  $('#researchStop').disabled=true;
  $('#researchStatus').textContent=
   (stopRequested?'Stopped. ':'Completed. ')+
   `${completed}/${total} runs. ${batch.length} configurations evaluated.`;
  drawResearchChart();
 }
}
function drawResearchChart(){
 const c=$('#researchChart');if(!c)return;
 const data=db.experiments.slice(-30).map(x=>x.validationLoss);
 const ctx=c.getContext('2d');
 const w=c.width=Math.max(300,c.clientWidth)*devicePixelRatio;
 const h=c.height=210*devicePixelRatio;
 ctx.clearRect(0,0,w,h);
 if(!data.length)return;
 const min=Math.min(...data),max=Math.max(...data);
 ctx.strokeStyle='#69c6ff';ctx.lineWidth=2;ctx.beginPath();
 data.forEach((v,i)=>{
  const x=20+(w-40)*i/Math.max(1,data.length-1);
  const y=h-20-(v-min)/(max-min||1)*(h-40);
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 });
 ctx.stroke();
}

/* STANDALONE EVOLUTION */
function evolutionView(){
 return `
 <section class="card">
 <h2>Evolution Engine</h2>
 <p>Tối ưu hệ số a,b của mô hình y=ax+b.</p>
 <div class="row">
 <label>Population<input id="evPop" type="number" value="40" min="10" max="150"></label>
 <label>Generations<input id="evGen" type="number" value="100" min="10" max="300"></label>
 <label>Mutation<input id="evMut" type="number" value=".2" min="0" max="1" step=".05"></label>
 </div>
 <button class="primary" onclick="singleEvolution()">Run</button>
 <pre id="evResult">Ready</pre>
 <canvas id="evChart"></canvas>
 </section>`;
}
function singleEvolution(){
 const p=Math.max(10,Math.min(150,+$('#evPop').value||40));
 const g=Math.max(10,Math.min(300,+$('#evGen').value||100));
 const m=Math.max(0,Math.min(1,+$('#evMut').value||.2));
 const r=runOneGA({population:p,generations:g,mutation:m},Date.now());
 const rec={
  id:uid(),date:new Date().toISOString(),hypothesis:'Manual evolution',
  population:p,mutation:m,generations:g,repeats:1,
  a:r.a,b:r.b,trainLoss:r.trainLoss,
  validationLoss:r.validationLoss,bestValidation:r.validationLoss
 };
 db.experiments.push(rec);saveDB();
 $('#evResult').textContent=
 `a = ${r.a.toFixed(6)}\nb = ${r.b.toFixed(6)}\nTraining MSE = ${r.trainLoss.toExponential(5)}\nValidation MSE = ${r.validationLoss.toExponential(5)}`;
 drawSeries($('#evChart'),r.bestHistory);
}
function drawSeries(c,data){
 if(!c)return;
 const ctx=c.getContext('2d');
 const w=c.width=Math.max(300,c.clientWidth)*devicePixelRatio;
 const h=c.height=210*devicePixelRatio;
 ctx.clearRect(0,0,w,h);
 if(!data.length)return;
 const max=Math.max(...data),min=Math.min(...data);
 ctx.strokeStyle='#69c6ff';ctx.lineWidth=2;ctx.beginPath();
 data.forEach((v,i)=>{
  const x=15+(w-30)*i/Math.max(1,data.length-1);
  const y=h-15-(v-min)/(max-min||1)*(h-30);
  i?ctx.lineTo(x,y):ctx.moveTo(x,y);
 });
 ctx.stroke();
}

/* BENCHMARK */
function benchmarkView(){
 return `
 <section class="card">
 <h2>Algorithm Benchmark</h2>
 <p>So sánh JavaScript native sort với Insertion Sort.</p>
 <label>Dataset size<input id="benchSize" type="number" value="3000" min="100" max="20000"></label>
 <button class="primary" onclick="runBenchmark()">Run Benchmark</button>
 <pre id="benchResult"></pre>
 </section>
 <section class="card"><h3>Recent benchmark history</h3>
 ${db.benchmarks.slice(-10).reverse().map(x=>
 `<div class="item">${x.n} items · Native ${x.native.toFixed(3)} ms · Insertion ${x.insertion===null?'Skipped':x.insertion.toFixed(3)+' ms'} · ${x.correct===null?'Not checked':x.correct?'PASS':'FAIL'}</div>`
 ).join('')}
 </section>`;
}
function runBenchmark(){
 const n=Math.max(100,Math.min(20000,+$('#benchSize').value||3000));
 const original=Array.from({length:n},()=>Math.random()*100000);
 const a=original.slice(),b=original.slice();
 let t=performance.now();
 a.sort((x,y)=>x-y);
 const native=performance.now()-t;
 let insertion=null,correct=null;
 if(n<=5000){
  t=performance.now();
  for(let i=1;i<b.length;i++){
   const key=b[i];let j=i-1;
   while(j>=0&&b[j]>key){b[j+1]=b[j];j--}
   b[j+1]=key;
  }
  insertion=performance.now()-t;
  correct=b.every((v,i)=>v===a[i]);
 }
 const rec={date:new Date().toISOString(),n,native,insertion,correct};
 db.benchmarks.push(rec);saveDB();
 $('#benchResult').textContent=
 `Native sort: ${native.toFixed(3)} ms\nInsertion sort: ${insertion===null?'Skipped for large dataset':insertion.toFixed(3)+' ms'}\nCorrectness: ${correct===null?'Not checked':correct?'PASS':'FAIL'}`;
 render();
}

/* VALIDATION */
function validationView(){
 const records=db.experiments.slice().sort((a,b)=>a.validationLoss-b.validationLoss);
 const best=records[0];
 return `
 <section class="card">
 <h2>Validation Engine</h2>
 <p>Kiểm định trên tập x độc lập với tập huấn luyện.</p>
 ${best?`<p>Best model: y=${best.a.toFixed(5)}x + ${best.b.toFixed(5)}</p>
 <p>Training MSE: ${best.trainLoss.toExponential(5)}</p>
 <p>Validation MSE: ${best.validationLoss.toExponential(5)}</p>
 <p>Distance from known target: ${Math.hypot(best.a-2,best.b-3).toFixed(6)}</p>
 <p class="${best.validationLoss<.01?'good':'warn'}">${best.validationLoss<.01?'Low validation error':'Needs further optimization'}</p>`:
 '<p>Chưa có dữ liệu để kiểm định.</p>'}
 <button class="primary" onclick="runValidation()">Run validation check</button>
 <pre id="validationOutput"></pre>
 </section>
 <section class="card">
 <h3>Validation rules</h3>
 <ul>
 <li>Parameters must be finite numbers.</li>
 <li>Loss must be non-negative.</li>
 <li>Training and validation data are separate.</li>
 <li>Compare repeated runs, not only the best single run.</li>
 <li>Do not claim general intelligence from this experiment.</li>
 </ul>
 </section>`;
}
function runValidation(){
 const best=db.experiments.slice().sort((a,b)=>a.validationLoss-b.validationLoss)[0];
 if(!best){$('#validationOutput').textContent='No experiment found';return}
 const finite=Number.isFinite(best.a)&&Number.isFinite(best.b);
 const lossOK=Number.isFinite(best.validationLoss)&&best.validationLoss>=0;
 $('#validationOutput').textContent=
 `Finite parameters: ${finite?'PASS':'FAIL'}\n`+
 `Valid loss: ${lossOK?'PASS':'FAIL'}\n`+
 `Target parameter distance: ${Math.hypot(best.a-2,best.b-3).toFixed(8)}\n`+
 `Independent validation points: 38\n`+
 `Result: ${finite&&lossOK?'PASS':'FAIL'}`;
}

/* KNOWLEDGE ARCHIVE */
function archiveView(){
 const records=db.archive.slice().reverse();
 return `
 <section class="card">
 <h2>Knowledge Archive</h2>
 <p>Tri thức được lưu từ các thí nghiệm đã chạy.</p>
 ${records.length?records.map((r,i)=>`
 <div class="item">
 <b>${esc(r.title)}</b>
 <p>${esc(r.text)}</p>
 <small>${esc(r.date)}</small>
 <br><button class="danger" onclick="deleteArchive('${r.id}')">Delete</button>
 </div>`).join(''):'<p class="muted">Chưa có dữ liệu lưu trữ.</p>'}
 <button onclick="clearArchive()" class="danger">Clear archive</button>

}
function deleteArchive(id){
 db.archive=db.archive.filter(x=>x.id!==id);saveDB();render();
}
function clearArchive(){
 if(confirm('Xóa toàn bộ Knowledge Archive?')){
  db.archive=[];saveDB();render();
 }
}

/* TASKS */
function tasksView(){
 return `
 <section class="card">
 <h2>Task Manager</h2>
 <input id="taskInput" placeholder="Nhập nhiệm vụ">
 <button class="primary" onclick="addTask()">Add Task</button>
 ${db.tasks.map((t,i)=>`<div class="item">
 ${t.done?'✓':'○'} ${esc(t.text)}
 <button onclick="toggleTask(${i})">Toggle</button>
 <button class="danger" onclick="removeRecord(db.tasks,${i})">Delete</button>
 </div>`).join('')}
 </section>`;
}
function addTask(){
 const v=$('#taskInput').value.trim();
 if(v)addRecord(db.tasks,{text:v,done:false});
}
function toggleTask(i){
 db.tasks[i].done=!db.tasks[i].done;saveDB();render();
}

/* MEMORY */
function memoryView(){
 return `
 <section class="card">
 <h2>Memory Database</h2>
 <textarea id="memoryInput" placeholder="Ghi lại ý tưởng, kết quả nghiên cứu..."></textarea>
 <button class="primary" onclick="addMemory()">Save Memory</button>
 ${db.memories.map((m,i)=>`<div class="item">
 ${esc(m.text)}
 <button class="danger" onclick="removeRecord(db.memories,${i})">Delete</button>
 </div>`).join('')}
 </section>`;
}
function addMemory(){
 const v=$('#memoryInput').value.trim();
 if(v)addRecord(db.memories,{text:v,date:new Date().toISOString()});
}

/* IMPORT / EXPORT */
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download='AI-ECOSYSTEM-V24-backup.json';
 a.click();URL.revokeObjectURL(url);
}
function importData(event){
 const file=event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const x=JSON.parse(reader.result);
   if(!x||!Array.isArray(x.experiments)||!Array.isArray(x.tasks))
    throw Error('Invalid format');
   db={...emptyDB,...x};saveDB();render();
   alert('Import successful');
  }catch(e){alert('File JSON không hợp lệ.');}
 };
 reader.readAsText(file);
}

render();
</script>
</body>
</html>
