
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>AI ECOSYSTEM V2.5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#e8eff9;font:15px system-ui}
header{padding:18px;background:#111c30;border-bottom:1px solid #293b55}
h1{margin:0;color:#79caff;font-size:22px}
main{max-width:1050px;margin:auto;padding:14px}
nav{display:flex;gap:7px;overflow:auto;padding:10px 0}
button{background:#1b2b43;color:#eaf3ff;border:1px solid #3b506e;border-radius:9px;padding:10px 13px;cursor:pointer;white-space:nowrap}
button.active,button.primary{background:#0879bb;border-color:#0879bb}
button.danger{background:#702d3b}
input,select,textarea{width:100%;background:#0c1728;color:white;border:1px solid #344965;border-radius:8px;padding:10px;margin:5px 0}
label{display:block;color:#a9bdd4;font-size:13px}
.card{background:#111c30;border:1px solid #293b55;border-radius:13px;padding:15px;margin:10px 0}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:15px;color:#8bd3ff}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1;min-width:115px}
.stat{background:#17263d;padding:12px;border-radius:10px;flex:1;min-width:100px}
.stat strong{display:block;font-size:22px;color:#75caff}
.item{padding:10px 0;border-bottom:1px solid #293b55;overflow-wrap:anywhere}
.muted{color:#91a4bd}
.good{color:#6fe0a4}
.warn{color:#ffd27b}
canvas{width:100%;height:210px;background:#0a1424;border-radius:9px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b7dcff}
footer{text-align:center;color:#71839b;padding:25px}
</style>
</head>
<body>
<header>
<h1>AI ECOSYSTEM V2.5</h1>
<small>Adaptive Intelligence · Meta-Evolution · Reproducible Research</small>
</header>
<main>
<nav id="nav"></nav>
<div id="app"></div>
<footer>Local research · No paid API · Android compatible</footer>
</main>
<script>
'use strict';

const $=s=>document.querySelector(s);
const KEY='ai_ecosystem_v25';
const empty={
 experiments:[],
 archive:[],
 tasks:[],
 memories:[],
 benchmarks:[]
};

let db=load();
let page='dashboard';
let busy=false;
let stop=false;

function load(){
 try{
  return {...empty,...JSON.parse(localStorage.getItem(KEY)||'{}')};
 }catch{
  return {...empty};
 }
}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(db));
  return true;
 }catch{
  alert('Bộ nhớ đầy. Hãy Export dữ liệu.');
  return false;
 }
}

function id(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function add(a,x){
 a.push({id:id(),...x});
 save();
 render();
}

function del(a,i){
 a.splice(i,1);
 save();
 render();
}

const tabs=[
 ['dashboard','Dashboard'],
 ['adaptive','Adaptive Research'],
 ['meta','Meta-Evolution'],
 ['compare','Model Compare'],
 ['archive','Archive'],
 ['tasks','Tasks'],
 ['memory','Memory'],
 ['benchmark','Benchmark']
];

function go(p){
 page=p;
 render();
}

function render(){
 $('#nav').innerHTML=tabs.map(([p,n])=>
  `<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`
 ).join('')+
 `<button onclick="exportDB()">Export</button>
  <button onclick="$('#file').click()">Import</button>
  <input hidden id="file" type="file" accept=".json" onchange="importDB(event)">`;

 const views={
  dashboard,
  adaptive,
  meta,
  compare,
  archive,
  tasks,
  memory,
  benchmark
 };

 $('#app').innerHTML=(views[page]||dashboard)();
}

function card(t,c){
 return `<section class="card"><h2>${t}</h2>${c}</section>`;
}

function dashboard(){
 const best=db.experiments.slice().sort((a,b)=>a.val-b.val)[0];

 return card('V2.5 Overview',`
 <div class="row">
  <div class="stat"><strong>${db.experiments.length}</strong>Runs</div>
  <div class="stat"><strong>${db.archive.length}</strong>Research records</div>
  <div class="stat"><strong>${db.tasks.length}</strong>Tasks</div>
 </div>`) +

 card('Best validated result',best?
 `<p>Validation MSE: <b>${best.val.toExponential(4)}</b></p>
 <p>Model y=${best.a.toFixed(5)}x + ${best.b.toFixed(5)}</p>
 <p>Strategy: ${esc(best.strategy)}</p>`:
 'Chưa chạy nghiên cứu.')+

 card('System',`
 <p>Execution: JavaScript / Chrome</p>
 <p>Storage: localStorage</p>
 <p>External paid API: none</p>
 <p>Offline capable: yes</p>`);
}

function adaptive(){
 return card('Adaptive Research',`
 <p>Hệ thống thử chiến lược, cập nhật mutation dựa trên mức cải thiện của lần chạy trước.</p>
 <div class="row">
  <label>Generations
   <input id="gens" type="number" value="70" min="10" max="200">
  </label>
  <label>Population
   <input id="pop" type="number" value="24" min="10" max="80">
  </label>
  <label>Adaptive rounds
   <input id="rounds" type="number" value="8" min="2" max="20">
  </label>
 </div>
 <button class="primary" id="start" onclick="startAdaptive()">Start Adaptive Research</button>
 <button class="danger" id="stop" onclick="stopRun()" disabled>Stop</button>
 <p id="status">Ready</p>
 <progress id="progress" value="0" max="1" style="width:100%"></progress>
 <canvas id="chart"></canvas>
 <pre id="out"></pre>`) +

 card('Adaptive policy',`
 <ul>
  <li>Khởi đầu mutation 0.20.</li>
  <li>Nếu loss giảm: giữ/giảm mutation nhẹ.</li>
  <li>Nếu loss không giảm: tăng mutation để khám phá.</li>
  <li>Giới hạn mutation 0.03–0.70.</li>
  <li>Ghi lại seed, strategy, loss và cấu hình.</li>
 </ul>
 <p class="warn">Adaptive policy là heuristic, không đảm bảo luôn tối ưu.</p>`);
}

function meta(){
 return card('Meta-Evolution',`
 <p>Thử các chiến lược điều chỉnh mutation: cố định, thích nghi theo tiến bộ, và khám phá mạnh.</p>
 <button class="primary" onclick="runMeta()">Run strategy tournament</button>
 <pre id="metaOut"></pre>`);
}

function compare(){
 const r=db.experiments.slice().sort((a,b)=>a.val-b.val);
 const b=r[0];

 return card('Model Comparison',b?
 `<p>Best model: a=${b.a.toFixed(6)}, b=${b.b.toFixed(6)}</p>
 <p>Validation MSE: ${b.val.toExponential(5)}</p>
 <p>Baseline (a=0,b=0) validation MSE: ${vloss(0,0).toExponential(5)}</p>
 <p>Known synthetic target (a=2,b=3) MSE: ${vloss(2,3).toExponential(5)}</p>
 <p class="${b.val<vloss(0,0)?'good':'warn'}">
 Compared against baseline: ${b.val<vloss(0,0)?'Improved':'Not improved'}
 </p>`:
 'Chưa có model.');
}

function archive(){
 return card('Research Archive',
 db.archive.slice().reverse().map(x=>
 `<div class="item">
  <b>${esc(x.title)}</b>
  <p>${esc(x.text)}</p>
  <small>${esc(x.date)}</small>
 </div>`
 ).join('')||'Chưa có bản ghi');
}

function tasks(){
 return card('Tasks',`
 <input id="task" placeholder="Nhiệm vụ">
 <button class="primary" onclick="addTask()">Add</button>
 ${db.tasks.map((t,i)=>
 `<div class="item">
  ${t.done?'✓':'○'} ${esc(t.text)}
  <button onclick="toggleTask(${i})">Toggle</button>
  <button class="danger" onclick="del(db.tasks,${i})">X</button>
 </div>`
 ).join('')}`);
}

function memory(){
 return card('Memory',`
 <textarea id="mem" placeholder="Ghi chú nghiên cứu"></textarea>
 <button class="primary" onclick="addMemory()">Save</button>
 ${db.memories.map((m,i)=>
 `<div class="item">
  ${esc(m.text)}
  <button class="danger" onclick="del(db.memories,${i})">X</button>
 </div>`
 ).join('')}`);
}

function benchmark(){
 return card('Benchmark',`
 <p>So sánh native sort và insertion sort.</p>
 <input id="bn" type="number" value="2000" min="100" max="10000">
 <button class="primary" onclick="bench()">Run</button>
 <pre id="br"></pre>
 ${db.benchmarks.slice(-10).reverse().map(x=>
 `<div class="item">
  ${x.n}: ${x.native.toFixed(2)}ms vs ${x.ins.toFixed(2)}ms · ${x.ok?'PASS':'FAIL'}
 </div>`
 ).join('')}`);
}
 
/* =========================================
   GENETIC ALGORITHM
========================================= */

function rand(a,b){
 return a+Math.random()*(b-a);
}

function target(x){
 return 2*x+3;
}

function loss(a,b){
 let s=0;
 for(let x=-10;x<=10;x+=0.5){
  let e=a*x+b-target(x);
  s+=e*e;
 }
 return s/41;
}

function vloss(a,b){
 let s=0,n=0;
 for(let x=-9.75;x<=9.75;x+=0.75){
  let e=a*x+b-target(x);
  s+=e*e;
  n++;
 }
 return s/n;
}

function individual(){
 return {a:rand(-10,10),b:rand(-10,10)};
}

function score(p){
 return loss(p.a,p.b);
}

function mutate(p,rate){
 return {
  a:p.a+(Math.random()<rate?rand(-2,2):0),
  b:p.b+(Math.random()<rate?rand(-2,2):0)
 };
}

function cross(p,q){
 return {
  a:(p.a+q.a)/2+rand(-0.2,0.2),
  b:(p.b+q.b)/2+rand(-0.2,0.2)
 };
}

function tournament(pop){
 let best=null;
 for(let i=0;i<3;i++){
  const p=pop[Math.floor(Math.random()*pop.length)];
  if(!best||score(p)<score(best))best=p;
 }
 return best;
}

function diversity(pop){
 let ma=0,mb=0;
 for(const p of pop){ma+=p.a;mb+=p.b;}
 ma/=pop.length;mb/=pop.length;
 let s=0;
 for(const p of pop){
  s+=(p.a-ma)**2+(p.b-mb)**2;
 }
 return Math.sqrt(s/pop.length);
}

function runGA(options={}){
 const generations=options.generations||70;
 const size=options.population||24;
 const rate=options.mutation||0.2;
 const seed=options.seed||Math.floor(Math.random()*1e9);

 let pop=Array.from({length:size},individual);
 let best=null;
 const history=[];

 for(let g=0;g<generations;g++){
  pop.sort((x,y)=>score(x)-score(y));

  if(!best||score(pop[0])<score(best)){
   best={...pop[0]};
  }

  history.push({
   generation:g,
   loss:score(best),
   diversity:diversity(pop)
  });

  const next=pop.slice(0,4).map(p=>({...p}));

  while(next.length<size){
   const p=tournament(pop);
   const q=tournament(pop);
   next.push(mutate(cross(p,q),rate));
  }

  pop=next;
 }

 return {
  a:best.a,
  b:best.b,
  train:loss(best.a,best.b),
  val:vloss(best.a,best.b),
  history,
  seed,
  mutation:rate,
  population:size,
  generations,
  strategy:options.strategy||'fixed'
 };
}

/* =========================================
   ADAPTIVE RESEARCH
========================================= */

async function startAdaptive(){
 if(busy)return;

 busy=true;
 stop=false;

 $('#start').disabled=true;
 $('#stop').disabled=false;

 const rounds=+$('#rounds').value||8;
 const generations=+$('#gens').value||70;
 const population=+$('#pop').value||24;

 let rate=0.2;
 let previous=Infinity;
 const results=[];

 for(let i=0;i<rounds;i++){
  if(stop)break;

  $('#status').textContent=
   `Round ${i+1}/${rounds} · Mutation ${rate.toFixed(3)}`;

  $('#progress').value=i/rounds;

  const r=runGA({
   generations,
   population,
   mutation:rate,
   strategy:'adaptive'
  });

  results.push(r);

  const improvement=previous-r.val;

  if(improvement>0){
   rate=Math.max(0.03,rate*0.85);
  }else{
   rate=Math.min(0.70,rate*1.35);
  }

  previous=r.val;

  await new Promise(resolve=>setTimeout(resolve,10));
 }

 db.experiments.push(...results);

 db.archive.push({
  id:id(),
  title:'Adaptive Research',
  date:new Date().toISOString(),
  text:`${results.length} runs · best validation ${
   Math.min(...results.map(r=>r.val)).toExponential(4)
  }`
 });

 save();

 $('#progress').value=1;
 $('#status').textContent='Completed';

 $('#out').textContent=results.map((r,i)=>
 `#${i+1} a=${r.a.toFixed(5)} b=${r.b.toFixed(5)}
 train=${r.train.toExponential(3)}
 validation=${r.val.toExponential(3)}
 mutation=${r.mutation.toFixed(3)}`
 ).join('\n');

 draw(results.at(-1)?.history||[]);

 busy=false;
 $('#start').disabled=false;
 $('#stop').disabled=true;
}

function stopRun(){
 stop=true;
 $('#status').textContent='Stopping...';
}

/* =========================================
   META-EVOLUTION
========================================= */

async function runMeta(){
 const out=$('#metaOut');
 out.textContent='Running tournament...';

 const strategies=[
  {name:'Fixed',mutation:0.2},
  {name:'Explore',mutation:0.5},
  {name:'Conservative',mutation:0.08}
 ];

 const results=[];

 for(const s of strategies){
  const r=runGA({
   generations:100,
   population:30,
   mutation:s.mutation,
   strategy:s.name
  });

  results.push(r);
  db.experiments.push(r);
  await new Promise(resolve=>setTimeout(resolve,10));
 }

 results.sort((a,b)=>a.val-b.val);

 db.archive.push({
  id:id(),
  title:'Meta-Evolution Tournament',
  date:new Date().toISOString(),
  text:results.map(r=>`${r.strategy}: ${r.val}`).join('; ')
 });

 save();

 out.textContent=results.map((r,i)=>
 `${i+1}. ${r.strategy}
 a=${r.a.toFixed(6)}
 b=${r.b.toFixed(6)}
 validation=${r.val.toExponential(5)}`
 ).join('\n\n');
}
 
/* =========================================
   CHART
========================================= */

function draw(history){
 const canvas=$('#chart');
 if(!canvas||!history.length)return;

 const ctx=canvas.getContext('2d');
 const w=canvas.width=canvas.clientWidth*devicePixelRatio;
 const h=canvas.height=canvas.clientHeight*devicePixelRatio;

 ctx.clearRect(0,0,w,h);
 ctx.strokeStyle='#263b57';
 ctx.lineWidth=1;

 for(let i=0;i<5;i++){
  const y=i*h/4;
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(w,y);
  ctx.stroke();
 }

 const values=history.map(x=>x.loss);
 const min=Math.min(...values);
 const max=Math.max(...values);
 const range=max-min||1;

 ctx.strokeStyle='#42c8ff';
 ctx.lineWidth=2;
 ctx.beginPath();

 values.forEach((v,i)=>{
  const x=i/(values.length-1||1)*w;
  const y=h-(v-min)/range*h;

  if(i===0)ctx.moveTo(x,y);
  else ctx.lineTo(x,y);
 });

 ctx.stroke();
}

/* =========================================
   TASKS
========================================= */

function addTask(){
 const el=$('#task');
 const text=el.value.trim();
 if(!text)return;

 add(db.tasks,{text,done:false});
 el.value='';
}

function toggleTask(i){
 db.tasks[i].done=!db.tasks[i].done;
 save();
 render();
}

/* =========================================
   MEMORY
========================================= */

function addMemory(){
 const el=$('#mem');
 const text=el.value.trim();
 if(!text)return;

 add(db.memories,{text,date:new Date().toISOString()});
 el.value='';
}

/* =========================================
   BENCHMARK
========================================= */

function insertionSort(a){
 for(let i=1;i<a.length;i++){
  const x=a[i];
  let j=i-1;

  while(j>=0&&a[j]>x){
   a[j+1]=a[j];
   j--;
  }

  a[j+1]=x;
 }

 return a;
}

function bench(){
 const n=Math.min(10000,Math.max(100,+$('#bn').value||2000));

 const source=Array.from({length:n},()=>Math.random());

 const a=source.slice();
 const b=source.slice();

 let t=performance.now();
 a.sort((x,y)=>x-y);
 const native=performance.now()-t;

 t=performance.now();
 insertionSort(b);
 const ins=performance.now()-t;

 const ok=a.every((x,i)=>x===b[i]);

 const r={n,native,ins,ok};
 db.benchmarks.push(r);
 save();

 $('#br').textContent=
 `N=${n}
 Native sort: ${native.toFixed(3)} ms
 Insertion sort: ${ins.toFixed(3)} ms
 Result: ${ok?'PASS':'FAIL'}`;

 render();
}

/* =========================================
   EXPORT / IMPORT
========================================= */

function exportDB(){
 const blob=new Blob(
  [JSON.stringify(db,null,2)],
  {type:'application/json'}
 );

 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');

 a.href=url;
 a.download='AI_ECOSYSTEM_V25_DATA.json';
 a.click();

 URL.revokeObjectURL(url);
}

function importDB(event){
 const file=event.target.files[0];
 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);

   if(!data||typeof data!=='object'){
    throw new Error('Invalid data');
   }

   db={...empty,...data};
   save();
   render();

   alert('Import thành công');
  }catch(e){
   alert('JSON không hợp lệ');
  }
 };

 reader.readAsText(file);
}

/* =========================================
   INITIALIZATION
========================================= */

render();
</script>
</body>
</html>
