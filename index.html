
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>AI ECOSYSTEM V2.3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#e5edf8;font:15px system-ui}
header{padding:20px;background:#111c30;border-bottom:1px solid #26344b}
h1{font-size:22px;margin:0;color:#70c7ff}
small{color:#93a4bb}
main{max-width:1000px;margin:auto;padding:14px}
nav{display:flex;gap:7px;overflow:auto;padding:8px 0 14px}
button{background:#1b2a42;color:#e5edf8;border:1px solid #344965;border-radius:9px;padding:10px 13px;cursor:pointer}
button.active,button.primary{background:#0879bb;border-color:#0879bb}
button.danger{background:#702b35}
input,textarea,select{width:100%;background:#101b2d;color:white;border:1px solid #344965;border-radius:8px;padding:10px;margin:5px 0}
.card{background:#111c30;border:1px solid #26364e;border-radius:13px;padding:15px;margin:10px 0}
h2{font-size:19px;margin-top:0}
h3{font-size:15px;color:#8bd4ff}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.stat{background:#17253b;padding:12px;border-radius:10px;flex:1;min-width:100px}
.stat strong{font-size:22px;color:#70c7ff;display:block}
.item{padding:10px;border-bottom:1px solid #26364e;display:flex;gap:8px;align-items:center;justify-content:space-between}
.item span{overflow-wrap:anywhere}
.hidden{display:none!important}
canvas{width:100%;height:220px;background:#0b1425;border-radius:10px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#a6d9ff}
footer{text-align:center;color:#71839b;padding:25px}
</style>
</head>
<body>
<header>
<h1>AI ECOSYSTEM V2.3</h1>
<small>Evolution • Algorithms • Research • Validation</small>
</header>
<main>
<nav id="nav"></nav>
<div id="app"></div>
<footer>Local research platform · No paid API · Data stored on device</footer>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='ai_ecosystem_v23';
const defaults={tasks:[],memories:[],runs:[],bench:[],notes:[]};
let db=load(),page='dashboard',lastRun=null,chartData=[];

function load(){
 try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}
 catch{return {...defaults}}
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(db));return true}
 catch{alert('Không đủ dung lượng lưu trữ. Hãy xuất dữ liệu JSON.');return false}
}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function add(arr,obj){arr.push({id:id(),...obj});save();render()}
function remove(arr,i){arr.splice(i,1);save();render()}
function nav(){
 const tabs=['dashboard','tasks','memory','evolution','benchmark','validation','experiments'];
 const names=['Dashboard','Tasks','Memory','Evolution','Benchmark','Validation','Experiments'];
 $('#nav').innerHTML=tabs.map((t,i)=>`<button class="${page===t?'active':''}" onclick="go('${t}')">${names[i]}</button>`).join('')+
 `<button onclick="exportJSON()">Export</button><button onclick="$('#file').click()">Import</button><input id="file" type="file" accept=".json" hidden onchange="importJSON(event)">`;
}
function go(p){page=p;render()}
function card(title,content){return `<section class="card"><h2>${title}</h2>${content}</section>`}
function render(){
 nav();const a=$('#app');
 if(page==='dashboard')a.innerHTML=dashboard();
 if(page==='tasks')a.innerHTML=tasks();
 if(page==='memory')a.innerHTML=memory();
 if(page==='evolution')a.innerHTML=evolution();
 if(page==='benchmark')a.innerHTML=benchmark();
 if(page==='validation')a.innerHTML=validation();
 if(page==='experiments')a.innerHTML=experiments();
}
function dashboard(){
 const r=db.runs.at(-1);
 return card('Research Dashboard',`<div class="row">
 <div class="stat"><strong>${db.runs.length}</strong>Evolution runs</div>
 <div class="stat"><strong>${db.bench.length}</strong>Benchmarks</div>
 <div class="stat"><strong>${db.tasks.length}</strong>Tasks</div>
 <div class="stat"><strong>${db.memories.length}</strong>Memories</div></div>`) +
 card('Latest evolution',r?`Best loss: <b>${r.bestLoss.toExponential(3)}</b><br>Model: y=${r.a.toFixed(4)}x + ${r.b.toFixed(4)}<br>Generations: ${r.generations}`:'Chưa có thí nghiệm')+
 card('System status',`<p>Storage: localStorage</p><p>Network API: không sử dụng</p><p>Mode: Simulation / Research</p><p>Data: ${navigator.onLine?'Online':'Offline'}</p>`);
}
function tasks(){
 return card('Task Manager',`<input id="taskText" placeholder="Nội dung nhiệm vụ">
 <button class="primary" onclick="addTask()">Thêm nhiệm vụ</button>
 <div>${db.tasks.map((t,i)=>`<div class="item"><span>${t.done?'✓':'○'} ${esc(t.text)}</span><div><button onclick="toggleTask(${i})">Đổi trạng thái</button><button class="danger" onclick="remove(db.tasks,${i})">X</button></div></div>`).join('')}</div>`);
}
function addTask(){let v=$('#taskText').value.trim();if(v)add(db.tasks,{text:v,done:false})}
function toggleTask(i){db.tasks[i].done=!db.tasks[i].done;save();render()}
function memory(){
 return card('Memory Database',`<textarea id="memText" placeholder="Ghi nhớ nghiên cứu, ý tưởng, kết quả"></textarea>
 <button class="primary" onclick="addMemory()">Lưu</button>
 ${db.memories.map((m,i)=>`<div class="item"><span>${esc(m.text)}</span><button class="danger" onclick="remove(db.memories,${i})">Xóa</button></div>`).join('')}`);
}
function addMemory(){let v=$('#memText').value.trim();if(v)add(db.memories,{text:v,date:new Date().toISOString()})}

function evolution(){
 return card('Evolution Engine – Genetic Algorithm',`
 <p>Tối ưu mô hình tuyến tính y = ax + b trên bộ dữ liệu tổng hợp công khai.</p>
 <p>Target: y = 2x + 3. Mục tiêu: giảm Mean Squared Error (MSE).</p>
 <div class="row"><label>Population<input id="pop" type="number" value="40" min="10" max="200"></label>
 <label>Generations<input id="gen" type="number" value="100" min="5" max="500"></label>
 <label>Mutation rate<input id="mut" type="number" value="0.2" min="0" max="1" step="0.05"></label></div>
 <button class="primary" onclick="runGA()">Run Evolution</button>
 <button onclick="stopGA()">Stop</button>
 <p id="gaStatus">Ready</p><canvas id="gaChart"></canvas><pre id="gaResult"></pre>`);
}
let stopFlag=false;
function stopGA(){stopFlag=true}
function rand(){return Math.random()}
function loss(a,b){
 let s=0;
 for(let x=-10;x<=10;x++)s+=(a*x+b-(2*x+3))**2;
 return s/21;
}
function runGA(){
 stopFlag=false;
 const N=Math.max(10,Math.min(200,+$('#pop').value||40));
 const G=Math.max(5,Math.min(500,+$('#gen').value||100));
 const M=Math.max(0,Math.min(1,+$('#mut').value||0.2));
 let pop=Array.from({length:N},()=>({a:rand()*20-10,b:rand()*20-10}));
 let history=[],best;
 const status=$('#gaStatus'),result=$('#gaResult');
 function score(p){return loss(p.a,p.b)}
 function tournament(){
  let b=pop[Math.floor(rand()*N)];
  for(let k=0;k<3;k++){let q=pop[Math.floor(rand()*N)];if(score(q)<score(b))b=q}
  return b;
 }
 for(let g=0;g<G;g++){
  if(stopFlag)break;
  pop.sort((x,y)=>score(x)-score(y));
  best={...pop[0]};
  history.push(score(best));
  let next=pop.slice(0,Math.max(2,Math.floor(N*.2))).map(x=>({...x}));
  while(next.length<N){
   let p=tournament(),q=tournament();
   let child={a:p.a*rand()+q.a*(1-rand()),b:p.b*rand()+q.b*(1-rand())};
   if(rand()<M)child.a+=(rand()-.5)*2;
   if(rand()<M)child.b+=(rand()-.5)*2;
   child.a=Math.max(-20,Math.min(20,child.a));
   child.b=Math.max(-20,Math.min(20,child.b));
   next.push(child);
  }
  pop=next;
 }
 pop.sort((x,y)=>score(x)-score(y));best=pop[0];
 const rec={date:new Date().toISOString(),a:best.a,b:best.b,bestLoss:score(best),generations:history.length,population:N,mutation:M,history};
 db.runs.push(rec);if(db.runs.length>100)db.runs.shift();save();lastRun=rec;chartData=history;
 status.textContent=stopFlag?'Stopped':'Completed';
 result.textContent=`Best a = ${best.a.toFixed(6)}\nBest b = ${best.b.toFixed(6)}\nMSE = ${score(best).toExponential(6)}\nGenerations = ${history.length}\nPopulation = ${N}\nMutation = ${M}`;
 drawChart($('#gaChart'),history);
}
function drawChart(c,data){
 if(!c)return;
 const ctx=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;
 ctx.clearRect(0,0,w,h);if(!data.length)return;
 const max=Math.max(...data),min=Math.min(...data),pad=25;
 ctx.strokeStyle='#55baff';ctx.lineWidth=2;ctx.beginPath();
 data.forEach((v,i)=>{
 const x=pad+(w-2*pad)*i/Math.max(1,data.length-1);
 const y=h-pad-(v-min)/(max-min||1)*(h-2*pad);
 i?ctx.lineTo(x,y):ctx.moveTo(x,y);
 });ctx.stroke();
}
function benchmark(){
 return card('Benchmark Center',`
 <p>Đo tốc độ sắp xếp dữ liệu và xác minh tính đúng đắn.</p>
 <label>Data size<input id="benchN" type="number" value="10000" min="100" max="500000"></label>
 <button class="primary" onclick="runBench()">Run benchmark</button>
 <pre id="benchResult"></pre>
 <div>${db.bench.slice(-10).reverse().map(x=>`<div class="item">${x.n} items | JS sort ${x.sort.toFixed(2)} ms | insertion ${x.insert.toFixed(2)} ms</div>`).join('')}</div>`);
}
function runBench(){
 const n=Math.max(100,Math.min(500000,+$('#benchN').value||10000));
 const data=Array.from({length:n},()=>Math.random()*100000);
 const copy=data.slice(),a=data.slice();
 let t=performance.now();copy.sort((x,y)=>x-y);let ts=performance.now()-t;
 let ti=null,correct=true;
 if(n<=20000){
 t=performance.now();
 for(let i=1;i<a.length;i++){let k=a[i],j=i-1;while(j>=0&&a[j]>k){a[j+1]=a[j];j--}a[j+1]=k}
 ti=performance.now()-t;
 correct=a.every((v,i)=>v===copy[i]);
 }
 const r={date:new Date().toISOString(),n,sort:ts,insert:ti,correct};
 db.bench.push(r);if(db.bench.length>100)db.bench.shift();save();
 $('#benchResult').textContent=`Native sort: ${ts.toFixed(3)} ms\nInsertion sort: ${ti===null?'Skipped (large dataset)':ti.toFixed(3)+' ms'}\nCorrectness: ${ti===null?'Not tested':correct?'PASS':'FAIL'}`;
 render();
}
function validation(){
 const r=db.runs.at(-1);
 return card('Validation Engine',`
 <p>Kiểm tra kết quả mô hình bằng tiêu chí độc lập.</p>
 <button class="primary" onclick="validateRun()">Validate latest run</button>
 <pre id="validationResult"></pre>`) +
 card('Validation principles',`<ul><li>Kiểm tra MSE không âm.</li><li>Đối chiếu nghiệm mục tiêu a=2, b=3.</li><li>Không xem một lần chạy là bằng chứng AI tổng quát.</li><li>Benchmark cần kiểm tra correctness trước speed.</li></ul>`);
}
function validateRun(){
 const r=db.runs.at(-1),o=$('#validationResult');
 if(!r){o.textContent='Chưa có evolution run';return}
 const mse=loss(r.a,r.b),target=Math.hypot(r.a-2,r.b-3);
 const ok=Number.isFinite(mse)&&mse>=0&&Number.isFinite(r.a)&&Number.isFinite(r.b);
 o.textContent=`Finite parameters: ${ok?'PASS':'FAIL'}\nMSE non-negative: ${mse>=0?'PASS':'FAIL'}\nDistance to target: ${target.toFixed(6)}\nConverged (<0.1): ${target<.1?'YES':'NO'}\nNote: target is synthetic and known in advance.`;
}
function experiments(){
 return card('Experiment Database',`
 <p>${db.runs.length} evolution records · ${db.bench.length} benchmark records</p>
 <button class="danger" onclick="clearRuns()">Clear experiments</button>
 <h3>Evolution history</h3>
 ${db.runs.slice(-20).reverse().map((r,i)=>`<div class="item"><span>${esc(r.date)}<br>Loss ${r.bestLoss.toExponential(3)} | a=${r.a.toFixed(3)} b=${r.b.toFixed(3)}</span></div>`).join('')}
 <h3>Benchmark history</h3>
 ${db.bench.slice(-20).reverse().map(r=>`<div class="item">${r.n} | ${r.sort.toFixed(2)} ms | ${r.correct?'PASS':'N/A'}</div>`).join('')}`);
}
function clearRuns(){if(confirm('Xóa toàn bộ lịch sử thí nghiệm?')){db.runs=[];db.bench=[];save();render()}}
function exportJSON(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='ai-ecosystem-v23.json';a.click();URL.revokeObjectURL(url);
}
function importJSON(e){
 const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{try{
 const x=JSON.parse(rd.result);
 if(!x||!Array.isArray(x.tasks)||!Array.isArray(x.runs))throw Error();
 db={...defaults,...x};save();render();alert('Import thành công');
 }catch{alert('JSON không hợp lệ hoặc không đúng định dạng')}};
 rd.readAsText(f);
}
render();
</script>
</body>
</html>
